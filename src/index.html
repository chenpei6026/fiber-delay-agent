<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FiberScope 光纤链路时延诊断</title>
<style>
:root{color-scheme:light;font-family:'Microsoft YaHei',sans-serif;color:#163044;background:#f1f5f8}*{box-sizing:border-box}body{margin:0}header{padding:24px 7%;background:#123448;color:white;display:flex;justify-content:space-between;align-items:center}header small{color:#a5cbd8}h1{font-size:25px;margin:0 0 8px}main{max-width:1200px;margin:28px auto;padding:0 24px}.tag{font-size:12px;background:#d8ecee;color:#145961;border-radius:20px;padding:7px 12px}.grid{display:grid;grid-template-columns:340px 1fr;gap:22px}.card{background:white;padding:24px;border-radius:14px;box-shadow:0 4px 22px #143d4610;margin-bottom:20px}h2{font-size:18px;margin:0 0 18px}label{display:block;font-size:13px;margin:15px 0 8px;color:#496476}select,textarea,input{font:inherit;width:100%;border:1px solid #cad8de;border-radius:8px;padding:10px;background:white}textarea{height:115px;resize:vertical;font-size:14px;line-height:1.7}button{font:inherit;background:#126d78;color:white;border:0;border-radius:8px;padding:13px;cursor:pointer;width:100%;margin-top:18px}button:disabled{opacity:.5}.muted{font-size:12px;line-height:1.9;color:#667d88}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0}.metric{background:#edf5f6;border-radius:9px;padding:14px}.metric b{display:block;font-size:22px;margin-top:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.65 Consolas,'Microsoft YaHei',monospace;background:#f1f5f7;padding:14px;border-radius:9px}.step{border-left:3px solid #1f8893;padding:4px 0 4px 13px;margin:12px 0}.badge{color:#9a5421;background:#fff0dd;border-radius:7px;padding:7px 12px;display:inline-block}ul{padding-left:20px;line-height:1.9}#status{font-size:13px;color:#507282;margin-top:16px}#result:empty:before{content:'选择案例并开始诊断，查看模型计划、工具记录与证据分析。';color:#738994}summary{cursor:pointer;font-size:14px}.eyebrow{font:12px Consolas;color:#53818a;letter-spacing:2px;margin-bottom:8px}@media(max-width:800px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr}}
</style>
<header><div><h1>FiberScope · 光纤链路时延诊断</h1><small>从测量到证据，再到可解释的建议</small></div><span class="tag">陈佩 23231203 / 赵浩然 23211256</span></header>
<main><div class="grid"><aside><div class="card"><div class="eyebrow">INVESTIGATE</div><h2>发起一次链路调查</h2><label>测试场景</label><select id="case"></select><label>运行方式</label><select id="mode"><option value="llm">Qwen3 本地模型 + 工具</option><option value="offline">离线规则演示（非 LLM）</option></select><label>用户问题</label><textarea id="question"></textarea><label>业务预算（ms）</label><input id="budget" type="number" min="0" step="any"><button id="run">开始诊断</button><div id="status">等待输入</div></div><div class="card muted">数据来源：本地模拟场景，未连接真实校园网或运营商设备。<br>传播下限不等于实际吞吐或总时延。业务阈值由使用者指定。<br>LLM 选择工具，程序校验参数并根据证据生成结论。</div></aside><section><div class="card" id="process"><div class="eyebrow">AGENT WORKSPACE</div><h2>任务理解与工具调用</h2><div id="plan" class="muted">模型会根据问题选择需要调用的工具。</div><div id="tools"></div></div><div class="card" id="result"></div><div class="card" id="rawbox" hidden><details><summary>完整运行记录（JSON）</summary><pre id="raw"></pre></details></div></section></div></main>
<script>
let cases=[];const el=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const list=a=>'<ul>'+a.map(v=>'<li>'+esc(v)+'</li>').join('')+'</ul>';const labels={healthy:'当前任务通过',excess_delay:'额外时延需要调查',propagation_limited:'传播下限超过预算',insufficient_data:'证据不足',inconsistent_data:'测量数据矛盾',invalid_input:'输入参数无效'};
function choose(){let c=cases[Number(el('case').value)];el('question').value=c.question;el('budget').value=c.budget_ms??'';}
fetch('/api/cases').then(r=>r.json()).then(cs=>{cases=cs;el('case').innerHTML=cs.map((c,i)=>`<option value="${i}">${esc(c.id+' · '+c.title)}</option>`).join('');el('case').value='1';choose()});el('case').onchange=choose;
el('run').onclick=async()=>{el('run').disabled=true;el('status').textContent='正在运行模型计划与网络工具…';try{let request={...cases[Number(el('case').value)],question:el('question').value};delete request.title;delete request.id;if(el('budget').value!=='')request.budget_ms=Number(el('budget').value);else delete request.budget_ms;let response=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request,mode:el('mode').value})});let a=await response.json();if(!response.ok)throw Error(a.error);el('plan').innerHTML='<b>'+esc(a.plan.intent)+'</b> · '+esc(a.plan.reason);el('tools').innerHTML=a['Tool Results'].map((t,i)=>`<div class="step"><b>${i+1}. ${esc(t.tool)}</b><pre>${esc(JSON.stringify(t,null,2))}</pre></div>`).join('');let metric=a['Tool Results'].find(t=>t.tool==='evaluate_link')?.result;el('result').innerHTML='<div class="eyebrow">EVIDENCE & CONCLUSION</div><h2>诊断结论</h2><div class="badge">'+esc(labels[a.verdict]??a.verdict)+'</div>'+(metric?'<div class="metrics"><div class="metric">单程传播下限<b>'+metric.one_way_propagation_ms.toFixed(3)+' ms</b></div><div class="metric">实测 RTT<b>'+(metric.measured_rtt_ms??'缺失')+' ms</b></div><div class="metric">额外 RTT<b>'+(metric.excess_rtt_ms?.toFixed(3)??'未知')+' ms</b></div></div>':'')+'<h3>观测证据</h3>'+list(a.Observations)+'<h3>可能原因</h3>'+list(a['Possible Causes'])+'<h3>分析</h3>'+list(a.Analysis)+'<h3>下一步建议</h3>'+list(a.Recommendation);el('raw').textContent=JSON.stringify(a,null,2);el('rawbox').hidden=false;el('status').textContent=`已完成 · ${a.elapsed_seconds.toFixed(2)} 秒 · ${a.mode}`;window.lastResult=a;}catch(e){el('status').textContent=e.message}finally{el('run').disabled=false}};
</script></html>
